# Goal: to check if the python code is syntactically correct.

name: Code Lint

on:
  push:
    branches:
     [main]
    
jobs:
  lintjob:
    runs-on: ubuntu-latest
    steps:
      - name: clone Code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: install dependency
        run: pip install -r requirements.txt

      - name: lint the code
        run: ruff check .