name: show env variables

on:
  workflow_dispatch:
    inputs:
      environments:
        description: Select the environment you want
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stg
          - prd

env:
  name: shubham

jobs:
  show_env:
    runs-on: ubuntu-latest
    steps:
      - name: show secrets
        run: echo "My name is ${{env.name}}"
      - name: show secrets
        run: echo "One fun secret is ${{secrets.BHUMI_SECRET}}"
      - name: show variables
        run: echo "My DockerHub user name is ${{vars.DOCKERHUB_USERNAME}}"
      - name: show the input env:
        run: echo "The selected env is ${{inputs.environment}}"
